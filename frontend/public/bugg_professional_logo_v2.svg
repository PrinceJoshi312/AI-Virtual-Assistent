  <text x="284" y="204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#666" letter-spacing="3.5" font-weight="400" style="fill:rgb(102, 102, 102);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">VIRTUAL ASSISTANT</text>
